# SwiftLint — https://realm.github.io/SwiftLint/
# Run: npm run lint  (or build in Xcode after adding SwiftLintPlugins)

included:
  - MediaOrganizer
  - Tests

excluded:
  - build
  - dist
  - .build
  - DerivedData

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_function_declarations: true

function_body_length:
  warning: 80
  error: 130

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 1200

identifier_name:
  min_length:
    warning: 2
    error: 2
  max_length:
    warning: 40
    error: 60
  excluded:
    - id
    - x
    - y
    - z

reporter: xcode
